#
# Exercises the workload-level securityContext rollup predicates.
---
# Fully hardened: PSS "restricted" compliant, no host access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardened
  namespace: default
spec:
  selector:
    matchLabels:
      app: hardened
  template:
    metadata:
      labels:
        app: hardened
    spec:
      automountServiceAccountToken: false
      containers:
      - name: app
        image: nginx:1.25
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          capabilities:
            add: ["NET_BIND_SERVICE"]
            drop: ["ALL"]
---
# Risky: privileged main container, host namespaces, hostPath volume, and a
# capability added in the init container too (to exercise dedup + init folding).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risky
  namespace: default
spec:
  selector:
    matchLabels:
      app: risky
  template:
    metadata:
      labels:
        app: risky
    spec:
      hostNetwork: true
      hostPID: true
      initContainers:
      - name: setup
        image: busybox:1.36
        securityContext:
          allowPrivilegeEscalation: true
          runAsUser: 0
          capabilities:
            add: ["NET_RAW", "SYS_ADMIN"]
      containers:
      - name: main
        image: docker:24
        securityContext:
          privileged: true
          runAsUser: 0
          capabilities:
            add: ["NET_RAW"]
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
---
# Container is silent on runAsNonRoot, but the pod-level context guarantees
# non-root: runsAsRoot must fold the pod default and report false.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podlevelnonroot
  namespace: default
spec:
  selector:
    matchLabels:
      app: podlevelnonroot
  template:
    metadata:
      labels:
        app: podlevelnonroot
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: app
        image: nginx:1.25
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
