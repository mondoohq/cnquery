syntax = "proto3";

package mql.llx;

option go_package = "go.mondoo.com/mql/llx";

message Primitive {
  string type = 1;

  // The value of the primitive in case of bool|int|float|string|ref|json
  // For array/map it holds the exact datatype as a string,
  // e.g. []int or map[string]string
  bytes value = 2;

  // In case of an array primitive, holds the data of the array
  // protolint:disable REPEATED_FIELD_NAMES_PLURALIZED
  repeated Primitive array = 3;

  // In case of a map primitive, holds the data of the map
  map<string, Primitive> map = 4;
}

// AssetValue is the payload of the native `asset` primitive type. It points at
// another asset by the resource that anchors it in the current asset's resource
// tree: the anchor is `(resource_type, resource_id)`. The owning asset id is
// contextual (the caller knows which asset it is evaluating), so it is NOT part
// of this value. See ADR 030.
message AssetValue {
  string resource_type = 1;
  string resource_id = 2;
}

message Function {
  string type = 1;
  repeated Primitive args = 3;
  // FIXME: this is a suggestion to allow function calls to be bound
  // to non-local references; Remove this comment or remove the feature
  uint64 binding = 4;

  // How this call behaves when it cannot resolve. See ADR 043 (strict mode).
  // A link fails to resolve when its binding is null, or - for a map or dict -
  // when the key it names is absent.
  enum Nullability {
    // Non-strict: a link that cannot resolve yields null, as it always has.
    NULLABILITY_UNSPECIFIED = 0;
    // Strict: a link that cannot resolve is an error. A binding that is a
    // short-circuited null (produced by an upstream NULLABILITY_OPTIONAL link)
    // still passes straight through.
    NULLABILITY_REQUIRED = 1;
    // The author wrote `?` before this link. It never errors, and a null result
    // is marked short-circuited so the rest of the chain passes it through.
    NULLABILITY_OPTIONAL = 2;
  }
  Nullability nullability = 5;
}

message Chunk {
  // These values predate the CALL_ prefix rule and renaming them is a wire
  // change, so it stays suppressed. Block form rather than `disable:next`:
  // protolint takes the expected prefix from the preceding enum, so adding
  // Function.Nullability above made a one-line suppression stop covering these.
  // protolint:disable ENUM_FIELD_NAMES_PREFIX
  enum Call {
    // protolint:disable:next ENUM_FIELD_NAMES_ZERO_VALUE_END_WITH
    PRIMITIVE = 0;
    FUNCTION = 1;
    PROPERTY = 2;
  }
  // protolint:enable ENUM_FIELD_NAMES_PREFIX
  Call call = 1;
  string id = 2;
  Primitive primitive = 3;
  Function function = 4;
}

message AssertionMessage {
  string template = 1;
  repeated uint64 refs = 2;
  repeated string checksums = 3;
  bool decode_block = 21;
}

message CodeV1 {
  string id = 1;
  repeated Chunk code = 2;
  int32 parameters = 3;
  repeated int32 entrypoints = 4;
  repeated int32 datapoints = 5;
  map<int32,string> checksums = 6;
  repeated CodeV1 functions = 7;
  // protolint:disable:next FIELD_NAMES_LOWER_SNAKE_CASE
  bool singleValue = 8; 
  map<int32,AssertionMessage> assertions = 20;
}

message Block {
  repeated Chunk chunks = 1;
  // Identifies if we return multiple or just a single value.
  // The difference is that blocks usually return the block type (a kind of map)
  // where this flag instructs it to just return the value instead.
  // protolint:disable:next FIELD_NAMES_LOWER_SNAKE_CASE
  bool singleValue = 2; 
  // Number of parameters that are directly provided to this block
  int32 parameters = 3;
  repeated uint64 entrypoints = 4;
  repeated uint64 datapoints = 5;
}

message CodeV2 {
  string id = 1;
  repeated Block blocks = 2;
  map<uint64,string> checksums = 5;
  map<uint64,AssertionMessage> assertions = 20;
}

message Labels {
  map<string,string> labels = 1;
}

message Documentation {
  string field = 1;
  string title = 2;
  string desc = 3;
  string provider = 4;
}

message CodeBundle {
  reserved 1, 21;
  CodeV2 code_v2 = 6;
  repeated Documentation suggestions = 2;
  string source = 3;
  Labels labels = 4;
  map<string,string> props = 5; // name + type
  string version = 20;
  string min_mondoo_version = 22;
  map<string,AssertionMessage> assertions = 23;
  // name + ref to the block of data
  map<string,uint64> auto_expand = 24;
  // ref + variable name; only used during label creation and discarded 
  // afterwards
  map<uint64,string> vars = 25;

  // Writer-schema identity (ADR 040 part 1): the version of every provider
  // whose schema this bundle was compiled against, keyed by the stable
  // provider name ("aws", "os") rather than by its module-path id, so the key
  // survives an id migration.
  //
  // This says what the compiler *saw*. It is provenance, not a requirement -
  // use min_provider_versions to decide whether a reader can execute the
  // bundle.
  map<string,string> provider_schemas = 26;

  // Minimum version of each provider required to execute this bundle, keyed by
  // the stable provider name.
  //
  // Derived at compile time as the highest `min_provider_version` over every
  // resource and field the bundle actually touches, so it is a real
  // requirement rather than a snapshot of the compiling machine. A reader whose
  // provider is older than this cannot resolve every name in the bundle, and
  // should say so instead of degrading the missing ones to null.
  map<string,string> min_provider_versions = 27;

  // Downgrade translations (ADR 040 part 6).
  //
  // Each entry says: a reader whose `provider` is older than `below_version`
  // cannot make the call at `ref`, and should run the block at `block_ref`
  // instead. The blocks themselves ship inside code_v2 as ordinary blocks with
  // their checksums already in place; nothing points at them until a patch
  // does, so a current reader carries them as unreachable weight and executes
  // pristine code.
  //
  // Patching rewrites one chunk in place and never touches the checksum map, so
  // a downgraded reader reports under exactly the checksums the producer
  // shipped and scoring does not fork across versions.
  repeated TranslationRef translations = 28;

  // Resources this bundle reached through the global namespace that do not hang
  // off an asset root and are not marked `@global` (ADR 031 point 7).
  //
  // In v14 a bare name resolves globally first and falls back to the asset root,
  // so both spellings work. In v15 the root is the namespace, and a name that is
  // neither rooted nor global stops resolving. This list is what makes that
  // cutover measurable: it is the set of names in this bundle that have no home
  // in the asset's tree, recorded rather than logged so tooling can show which
  // parts of a bundle reach outside it.
  //
  // Empty when every name resolved is either rooted or marked global, which is
  // the state a fully migrated provider produces.
  repeated string unrooted_resources = 29;

  // The asset root this bundle was compiled against (ADR 031), empty when it
  // was compiled without one. Provenance - what the query was bounded by - and
  // what lets a reader tell the chunks the compiler inserted to reach the root
  // from the ones the author wrote.
  string asset_root = 30;
}

// TranslationRef points one call that an older reader cannot make at a block
// that computes the same value out of vocabulary it does have.
message TranslationRef {
  // Ref of the chunk in code_v2 to replace.
  uint64 ref = 1;
  // Provider id whose version decides whether this applies.
  string provider = 2;
  // Readers older than this need the translation. It is the version that
  // introduced the change being compensated for.
  string below_version = 3;
  // Block ref computing the replacement. It is bound to the replaced chunk's
  // own binding - the parent - because the field being replaced may not exist
  // on the reader at all, so there is no old value to transform.
  uint64 block_ref = 4;
}

message Result {
  Primitive data = 1;
  string error = 2;
  string code_id = 3;
}

message ResourceRecording {
  string resource = 1;
  string id = 2;
  map<string, Result> fields = 3;
  int64 created = 4;
  int64 updated = 5;
}

message Rating {
  string id = 1; // can either be the collection or the query
  string endpoint = 2;
  int32 tests = 3;
  int32 score = 4;
  int32 trend = 5;
  string date = 6;
}

message AssessmentItem {
  bool success = 1;
  string checksum = 2;
  uint64 entrypoint = 3;
  uint64 ref = 9;
  Primitive expected = 4;
  Primitive actual = 5;
  string operation = 6;
  string error = 7;
  bool is_assertion = 8;
  string template = 20;
  repeated Primitive data = 21;
}

message Assessment {
  string checksum = 1;
  bool success = 2;
  bool is_assertion = 3;
  repeated AssessmentItem results = 4;
}

message IP {
  bytes address = 1;
  bool has_prefix = 2;
  int32 prefix_length = 3;
}