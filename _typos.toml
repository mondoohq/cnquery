# Configuration for the `typos` spell checker (https://github.com/crate-ci/typos).
# Run locally with `typos` (and `typos --write-changes` to auto-fix).

[default]
# Enforce US English. Every British-spelling variant in the tree was converted
# when this was turned on; the identifiers that upstream APIs, SDKs, or already
# shipped MQL schema fields spell the British way are exempted below.
locale = "en-us"

[files]
extend-exclude = [
  # Generated code — owned by code generators, not hand-edited.
  "*.pb.go",
  "*.lr.go",
  "*.lr.versions",
  "*.ranger.go",
  "*.resources.json",
  "*.permissions.json",
  # Test fixtures and recordings often contain captured real-world data.
  "**/testdata/**",
  # Lockfiles and binary-ish assets.
  "go.sum",
  "*.svg",
]

# Words typos must not flag. Each maps to itself (i.e. "this spelling is fine").
# Three groups: real technical terms/abbreviations, a company name, and
# pre-existing misspellings that are baked into MQL schema field names or
# exported Go identifiers — renaming those is a breaking change, so they are
# baselined here and left for a separate, deliberate cleanup.
[default.extend-words]
# Technical terms, abbreviations, command names, and short identifier fragments.
# GOST is the Russian cryptographic standard family, and the IANA mnemonic for
# DNSSEC algorithms 12/23 and DS digest types 3/5. Not a misspelling of "ghost".
gost = "gost"
# MikroTik RouterOS (and the go-routeros SDK package name).
routeros = "routeros"
aks = "aks"
nd = "nd"
hashi = "hashi"
udid = "udid"
writeable = "writeable"
unparseable = "unparseable"
unparented = "unparented"
signins = "signins"
copywrite = "copywrite"
exportfs = "exportfs"
xwindows = "xwindows"
snet = "snet"
aci = "aci"
afe = "afe"
ags = "ags"
anc = "anc"
aso = "aso"
ba = "ba"
caf = "caf"
cpy = "cpy"
daa = "daa"
ded = "ded"
dne = "dne"
ede = "ede"
ein = "ein"
fo = "fo"
gae = "gae"
hda = "hda"
hel = "hel"
hpe = "hpe"
inh = "inh"
ist = "ist"
mak = "mak"
mis = "mis"
ot = "ot"
pn = "pn"
sie = "sie"
sur = "sur"
thr = "thr"
tre = "tre"
ue = "ue"
# Tomcat's logging package, org.apache.juli (Java Util Logging Implementation).
# It appears verbatim in every Tomcat logging.properties and in the jar name
# bin/tomcat-juli.jar, so references to it cannot be respelled.
juli = "juli"
# MITRE (as in MITRE ATT&CK) reads as a misspelling of "miter" under the en-us
# locale. It is a proper noun in prose, in the mitreTechniques MQL field, and in
# Graph's GetMitreTechniques accessor.
mitre = "mitre"
# Spectre, the CPU side-channel vulnerability, as reported by /proc/cpuinfo in
# the bug names spectre_v1 and spectre_v2.
spectre = "spectre"
# EndeavourOS, an Arch-based Linux distribution, detected by the os provider.
endeavour = "endeavour"
# Company name.
automattic = "automattic"
# Python package on PyPI providing Mozilla's CA bundle. The project spells it
# without the trailing "y", so every reference to it must stay verbatim.
certifi = "certifi"
# Misspelled JSON serialization tag kept for wire/persisted-data compatibility
# (the Go field itself is spelled correctly).
reciever = "reciever"
# Intentional values in test fixtures (character names, test input strings)
# that must stay verbatim.
yor = "yor"
yoman = "yoman"
# German word ("as") in a localized PowerShell error string used to test
# non-English Defender availability detection.
als = "als"
# Windows registry value name for the PowerShell transcription policy
# (HKLM\...\PowerShell\Transcription\EnableTranscripting). Microsoft's own
# spelling, so it must stay verbatim to match the real registry key.
transcripting = "transcripting"
# Alibaba Cloud Go SDK field spellings baked into exported identifiers
# (RouteEntrys, MaxLoginAttemps, IzNo, LoadBalancerBussinessStatus,
# ScalingConfiguration.PasswordSetted). These are the SDK's own spellings, so
# references to them cannot be renamed.
entrys = "entrys"
attemps = "attemps"
iz = "iz"
bussiness = "bussiness"
setted = "setted"
# Alibaba Cloud OSS Go SDK fields RefererList.Referers and
# RefererBlacklist.Referers. "Referer" is the HTTP header's own historical
# misspelling, which the SDK then pluralizes; both are the SDK's spelling, so
# reads of them cannot be renamed.
referers = "referers"
# Alibaba Cloud API enum value: SecurityEnhancementStrategy is either "Active"
# or "Deactive". Documenting it any other way would not match what the API
# returns.
deactive = "deactive"
# SCIM comparison operator meaning "not in", used by OCI identity domain
# condition rules alongside eq, ne, co, sw, ew, gt, ge, lt, le and in.
# Documenting the operator set any other way would not match what a rule
# actually compares on.
nin = "nin"
# Databricks Go SDK type name GetPrivateAccesRequest (missing the second "s").
# The SDK's own spelling, so references to it cannot be renamed.
acces = "acces"
# Azure Go SDK field armnetwork.MatchCondition.NegationConditon (missing the
# "i"). Azure's own spelling in both the SDK and the REST contract, so reads of
# it cannot be renamed.
conditon = "conditon"
# Pre-existing misspellings in MQL schema fields / exported Go identifiers.
# Renaming these would break the schema or API, so they are baselined.
appliable = "appliable"
applyable = "applyable"
setable = "setable"
valueable = "valueable"
accessable = "accessable"
policys = "policys"
inable = "inable"
datas = "datas"
childs = "childs"
softwares = "softwares"
splitted = "splitted"

# Whole identifiers that must stay verbatim. Narrower than extend-words: this
# exempts the named identifier only, rather than every occurrence of the
# fragment inside it.
[default.extend-identifiers]
# OCI Go SDK field identitydomains.KmsiSetting.TouPromptDisabled, where "Tou"
# is Terms Of Use. The SDK's own spelling, so reads of it cannot be renamed.
TouPromptDisabled = "TouPromptDisabled"
# AMD ROCm environment variable HSA_OVERRIDE_GFX_VERSION, where HSA is
# Heterogeneous System Architecture. Ollama reads it to pick a GPU target, so
# the name must stay verbatim to match the variable the daemon actually looks
# up.
HSA_OVERRIDE_GFX_VERSION = "HSA_OVERRIDE_GFX_VERSION"
# Upstream API and SDK spellings, and the MQL fields derived from them. Renaming
# any of these would either break the wire contract or break the schema, so only
# the exact identifier is exempted -- the same word stays flagged in prose.
AnalyseAsset = "AnalyseAsset"
AnalyseAssetRequest = "AnalyseAssetRequest"
AnalyseIncognitoAssetInput = "AnalyseIncognitoAssetInput"
analyseIncognitoAssetVulnerabilities = "analyseIncognitoAssetVulnerabilities"
ContentSynchronisation = "ContentSynchronisation"
contentSynchronisation = "contentSynchronisation"
ContentSynchronisationEnabled = "ContentSynchronisationEnabled"
contentSynchronisationEnabled = "contentSynchronisationEnabled"
FixVersionDependant = "FixVersionDependant"
fixVersionDependant = "fixVersionDependant"
fix_version_dependant = "fix_version_dependant"
SynchroniseConsumerGroupOffsets = "SynchroniseConsumerGroupOffsets"
synchroniseConsumerGroupOffsets = "synchroniseConsumerGroupOffsets"
AllowQueueing = "AllowQueueing"
allowQueueing = "allowQueueing"
GetBehaviourOk = "GetBehaviourOk"
FixKustomizationPreMarshalling = "FixKustomizationPreMarshalling"
